<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Creator Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ff2ea8'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="profile">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" src="assets/avatar.svg" alt="Creator profile photo" draggable="false" />
          <span class="online" aria-label="Online"></span>
        </div>
        <div class="identity">
          <div class="name-row">
            <h1 id="creatorName">YOUR NAME</h1>
            <span class="badges">
              <span id="flag" class="flag" title="Country">🇺🇸</span>
              <span class="verified" title="Verified">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 2.2 3.1-.4 1 3 2.8 1.5-1.5 2.8 1.5 2.8-2.8 1.5-1 3-3.1-.4L12 22l-2.2-2.2-3.1.4-1-3L2.9 15.7l1.5-2.8L2.9 10.1l2.8-1.5 1-3 3.1.4L12 2zm-1.2 13.3l5.5-5.5-1.4-1.4-4.1 4.1-2-2-1.4 1.4 3.4 3.4z"/></svg>
              </span>
            </span>
          </div>
          <p id="tagline" class="tagline">Your favorite creator for exclusive content, live shows & more</p>
          <div class="stats">
            <div class="stat">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM2 8v10a2 2 0 002 2h16"/><path d="M10 9l6 4-6 4V9z"/></svg>
              <div>
                <strong id="videoCount">459</strong>
                <span>VIDEOS</span>
              </div>
            </div>
            <div class="stat">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5.5-5.5-8.5 8"/></svg>
              <div>
                <strong id="photoCount">981</strong>
                <span>PHOTOS</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="ctas">
        <a id="liveLink" class="cta" href="#" target="_blank" rel="noopener">
          <span class="cta-icon fire">🔥</span>
          <span class="cta-copy">
            <strong>WATCH ME NOW</strong>
            <small>Join my live show</small>
          </span>
          <span class="arrow">›</span>
        </a>
        <a id="premiumLink" class="cta" href="#" target="_blank" rel="noopener">
          <span class="cta-icon lock">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          </span>
          <span class="cta-copy">
            <strong>EXCLUSIVE CONTENT</strong>
            <small>View premium content</small>
          </span>
          <span class="arrow">›</span>
        </a>
      </div>
    </section>
    <section class="gallery-block">
      <div class="gallery-head">
        <div class="left">
          <span class="dot"></span>
          <strong><span id="photoCountLabel">981</span> PHOTOS</strong>
          <span class="updated">UPDATED TODAY</span>
        </div>
        <a id="viewAll" class="view-all" href="#" target="_blank" rel="noopener">VIEW ALL CONTENT ›</a>
      </div>
      <div class="gallery">
        <a class="shot premium-link" href="#"><img src="assets/g1.svg" alt="Preview 1" draggable="false" /></a>
        <a class="shot premium-link" href="#"><img src="assets/g2.svg" alt="Preview 2" draggable="false" /></a>
        <a class="shot premium-link" href="#"><img src="assets/g3.svg" alt="Preview 3" draggable="false" /></a>
        <a class="shot locked premium-link" href="#">
          <img src="assets/g4.svg" alt="Locked premium preview" draggable="false" />
          <span class="lock-overlay">
            <svg viewBox="0 0 64 64"><rect x="14" y="30" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><path d="M22 30v-8a10 10 0 0120 0v8" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="43" r="4"/></svg>
          </span>
        </a>
      </div>
    </section>
  </main>
  <footer>
    <a href="dmca.html">DMCA</a>
    <span>© <span id="year">2026</span> <span id="footerName">YOUR NAME</span>. All rights reserved</span>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
